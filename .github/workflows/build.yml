name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (iPhone 17 Pro Simulator)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -scheme PPOI \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16 Pro' \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild \
              -scheme PPOI \
              -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16 Pro' \
              -configuration Debug \
              build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

      - name: SwiftFormat lint
        run: |
          brew install swiftformat
          swiftformat --lint PPOI/ PPOIWidget/ --config .swiftformat

  test:
    name: Unit Tests
    runs-on: macos-15
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme PPOITests \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16 Pro' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
        continue-on-error: true
        # PPOITests target added in Phase 1 — this step is a no-op until then
