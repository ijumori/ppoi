name: PPOI
options:
  bundleIdPrefix: com.takahiro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: NXFZ5AUX62
    # E2: Enable position-independent executables (ASLR)
    GCC_GENERATE_POSITION_DEPENDENT_CODE: NO
    # E2: Stack buffer overflow protection
    OTHER_CFLAGS: ["-fstack-protector-all"]

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0

targets:
  PPOI:
    type: application
    platform: iOS
    sources:
      - path: PPOI
        excludes:
          - "**/.DS_Store"
          - "**/GoogleService-Info.plist.example"
    resources:
      - path: PPOI/Resources/GoogleService-Info.plist
        optional: true
      - path: PPOI/Resources/AdMobConfig.plist
        optional: true
      - path: PPOI/Resources/AdMobConfig.plist.example
      - path: PPOI/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: PPOIWidget
    info:
      path: PPOI/Resources/Info.plist
      properties:
        GADApplicationIdentifier: ca-app-pub-5816327733677416~9254015974
        CFBundleDisplayName: "っぽい格言"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSUserTrackingUsageDescription: "広告の表示内容をあなたの興味に合わせるために使用します。許可しなくても、アプリは通常どおり利用できます。"
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # E3: Disable third-party keyboards (prevents keyloggers)
        UIApplicationSupportsThirdPartyKeyboards: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.takahiro.ppoi
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: PPOI/Resources/PPOI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # E1: Strip debug symbols in Release
        STRIP_INSTALLED_PRODUCT: YES
        COPY_PHASE_STRIP: YES
        DEAD_CODE_STRIPPING: YES
        # E1: Strip Swift symbols
        STRIP_SWIFT_SYMBOLS: YES
        # E2: Enable Address Space Layout Randomization
        LD_PIE: YES
        # E2: Enable ARC — already default but explicit
        CLANG_ENABLE_OBJC_ARC: YES
        # E2: Disable bitcode (deprecated but explicit)
        ENABLE_BITCODE: NO
        # E2: Enable all compiler warnings
        GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
        GCC_WARN_UNUSED_FUNCTION: YES
        GCC_WARN_UNUSED_VARIABLE: YES
        CLANG_WARN_EMPTY_BODY: YES
        CLANG_WARN_UNREACHABLE_CODE: YES
      configs:
        Release:
          # E1: Aggressive optimization + symbol stripping for Release
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          # E1: Remove debug info from binary
          STRIP_INSTALLED_PRODUCT: YES
          DEPLOYMENT_POSTPROCESSING: YES
          # E2: Fortify source for buffer overflow detection
          OTHER_CFLAGS: ["-fstack-protector-all", "-D_FORTIFY_SOURCE=2"]
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  PPOIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PPOIWidget
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
      - path: PPOI/Core/Persistence/SharedQuoteStore.swift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.takahiro.ppoi.PPOIWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PPOIWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PPOIWidget/PPOIWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NXFZ5AUX62
        SWIFT_VERSION: "5.0"

  PPOIScreenshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PPOIScreenshotTests
    dependencies:
      - target: PPOI
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.takahiro.ppoi.screenshottests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PPOI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PPOI"

schemes:
  PPOI:
    build:
      targets:
        PPOI: all
    run:
      config: Debug
      storeKitConfiguration: PPOI.storekit
    test:
      targets:
        - PPOIScreenshotTests
